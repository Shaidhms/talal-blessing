<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>For Talal</title>
  <meta name="description" content="A blessing and duaa for Talal — MashaAllah Tabarakallah." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;700&family=Cinzel:wght@400;700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="locked">

  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <div class="loader-text">Preparing<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </div>

  <button id="audio-toggle" aria-label="Toggle nasheed" title="Toggle nasheed">
    <svg id="icon-muted" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    <svg id="icon-unmuted" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
  </button>

  <button id="pause-toggle" aria-label="Pause / resume" title="Pause / resume">
    <svg id="icon-playing" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" /><rect x="14" y="5" width="4" height="14" /></svg>
    <svg id="icon-paused" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="6 4 20 12 6 20 6 4" /></svg>
  </button>

  <!-- BACKGROUND VIDEO (covered by shutters initially) -->
  <div id="video-wrap">
    <video id="bg-video" muted playsinline preload="auto">
      <source src="talal-video.mp4" type="video/mp4" />
    </video>
    <div id="video-vignette"></div>
  </div>

  <!-- 4 SHUTTER PANELS - one per quadrant -->
  <div id="shutters">
    <div class="shutter shutter-tl" data-quadrant="tl"><div class="shutter-inner"></div></div>
    <div class="shutter shutter-tr" data-quadrant="tr"><div class="shutter-inner"></div></div>
    <div class="shutter shutter-bl" data-quadrant="bl"><div class="shutter-inner"></div></div>
    <div class="shutter shutter-br" data-quadrant="br"><div class="shutter-inner"></div></div>
  </div>

  <!-- COCKPIT ENTRY -->
  <div id="entry">
    <div id="cockpit-image"></div>
    <div id="cockpit-overlay"></div>
    <canvas id="effects-canvas"></canvas>

    <!-- 4 numbered hotspots — sequence: TR=1, TL=2, BL=3, BR=4 -->
    <button class="cockpit-hotspot hotspot-tr" data-quadrant="tr" data-num="1" aria-label="Step 1">
      <span class="hotspot-ring"></span>
      <span class="hotspot-pulse"></span>
    </button>
    <button class="cockpit-hotspot hotspot-tl" data-quadrant="tl" data-num="2" aria-label="Step 2">
      <span class="hotspot-ring"></span>
      <span class="hotspot-pulse"></span>
    </button>
    <button class="cockpit-hotspot hotspot-bl" data-quadrant="bl" data-num="3" aria-label="Step 3">
      <span class="hotspot-ring"></span>
      <span class="hotspot-pulse"></span>
    </button>
    <button class="cockpit-hotspot hotspot-br" data-quadrant="br" data-num="4" aria-label="Step 4">
      <span class="hotspot-ring"></span>
      <span class="hotspot-pulse"></span>
    </button>

    <div id="entry-text">
      <div class="entry-top">
        <div class="entry-eyebrow">✦ For Our Beloved ✦</div>
        <div class="entry-name">TALAL</div>
      </div>
      <div class="entry-prompt">
        <div class="entry-prompt-text">Touch each control to engage</div>
        <div class="entry-counter">
          <span class="counter-pip" data-id="tl"></span>
          <span class="counter-pip" data-id="tr"></span>
          <span class="counter-pip" data-id="bl"></span>
          <span class="counter-pip" data-id="br"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN STAGE -->
  <div id="main-stage">
    <div id="left-column">
      <div id="stream-viewport">
        <div id="stream-track"></div>
      </div>
    </div>
  </div>

  <!-- FREEZE-FRAME CARD: appears centered on the video's last frame -->
  <div id="freeze-card">
    <div class="freeze-ameen">آمين</div>
    <div class="freeze-divider"></div>
    <div class="freeze-name">With All Love — Shaid Mama</div>
  </div>

  <audio id="nasheed" loop preload="auto">
    <source src="assets/audio/nasheed.mp3" type="audio/mpeg" />
  </audio>

  <script type="module" src="src/main.js"></script>
</body>
</html>
